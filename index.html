<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kabadiwala Connect | SIH26229</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast"></div>
  <div id="authView" class="center-screen">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">KC</span><div><b>Kabadiwala Connect</b><small>SIH26229 • E-Waste Formalization</small></div></div>
      <div id="authTabs" class="tabs">
        <button class="tab active" data-auth="login">Login</button>
        <button class="tab" data-auth="register">Register</button>
      </div>
      <form id="authForm">
        <input id="authName" placeholder="Full name" class="register-only hidden">
        <input id="authEmail" type="email" placeholder="Email" required>
        <input id="authPassword" type="password" placeholder="Password" minlength="6" required>
        <select id="authRole" class="register-only hidden">
          <option value="collector">Collector</option>
          <option value="recycler">Recycler</option>
        </select>
        <button class="primary full" id="authSubmit">Login</button>
      </form>
      <p class="muted small">Demo MVP • Hindi/Marathi-ready • Offline queue</p>
    </div>
  </div>

  <div id="appView" class="hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">KC</span><div><b>Kabadiwala</b><small>Connect</small></div></div>
      <nav id="nav"></nav>
      <div class="side-bottom">
        <div id="onlineStatus" class="status-pill">● Online</div>
        <button id="logoutBtn" class="ghost full">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle" class="muted">Collector-first e-waste formalization</p>
        </div>
        <div class="user-chip"><span id="userInitial">U</span><div><b id="userName">User</b><small id="userRole">collector</small></div></div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
